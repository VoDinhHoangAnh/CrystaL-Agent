name: Go checks

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows all packages
        if: runner.os == 'Windows'
        run: |
          go test ./...
          go vet ./...
      - name: Linux portable packages
        if: runner.os == 'Linux'
        run: |
          go test ./internal/...
          go vet ./internal/...
