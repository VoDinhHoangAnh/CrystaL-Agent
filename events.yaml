# Nguồn Event Log Windows mà agent đăng ký theo dõi.
# event_ids là các mã được lọc trong từng channel; không tự bật audit policy.
groups:
  # Dùng thất bại và thành công để Behavior Analyst ghép chuỗi đăng nhập.
  # Log 4776/4771 có thể nằm trên máy xác thực/domain controller.
  - name: brute_force_authentication
    category: bruteforce
    channel: Security
    event_ids: [4624, 4625, 4740, 4771, 4776]

  # 4624 cần đọc LogonType; 5156 chỉ có nếu Windows bật audit Filtering Platform.
  - name: network_logon_and_service_access
    category: network_login
    channel: Security
    event_ids: [4624, 4648, 4768, 4769, 4776, 5156]

  - name: remote_desktop_authentication
    category: network_login
    channel: Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational
    event_ids: [1149]

  # Sysmon 3 cần bật cấu hình NetworkConnect; ProcessGuid là khóa ghép ưu tiên.
  - name: process_lifecycle_and_network_follow
    category: process
    channel: Microsoft-Windows-Sysmon/Operational
    event_ids: [1, 3, 5, 22]

  - name: process_creation_and_exit
    category: process
    channel: Security
    event_ids: [4688, 4689]

  - name: service_lifecycle
    category: process
    channel: System
    event_ids: [7036, 7045]
